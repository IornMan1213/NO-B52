# Quick checks on every push and pull request (free on public repositories). The plugin itself can't be compiled here:
# it builds against the game's own assemblies, which can't be uploaded. Build it locally with tools/build_all.sh.
name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python scripts compile
        run: python3 -m py_compile tools/*.py
      - name: Shell scripts parse
        run: for f in tools/*.sh tests/ingame/run.sh; do bash -n "$f" || exit 1; done
      - name: VERSION is a plain version number
        run: grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
      - name: Changelog mentions the version
        run: grep -q "^## $(tr -d ' \r\n' < VERSION)" CHANGELOG.md
