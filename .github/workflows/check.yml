# Quick checks on every push and pull request (free on public repositories). The plugin itself can't be compiled here:
# it builds against the game's own assemblies, which can't be uploaded. Build it locally with tools/build_all.sh.
name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python scripts compile
        run: python3 -m py_compile tools/*.py
      - name: Shell scripts parse
        run: for f in tools/*.sh tests/ingame/run.sh; do bash -n "$f" || exit 1; done
      - name: Plugin and aircraft versions match
        run: |
          b=$(grep -oE 'const string Version = "[^"]+"' unity/B52Tools/Editor/B52Builder.cs | grep -oE '[0-9][0-9.]*[0-9]')
          p=$(grep -oE 'BepInPlugin\("[^"]+", "[^"]+", "[^"]+"\)' plugin/B52Systems/Plugin.cs | grep -oE '"[0-9][0-9.]*"' | tr -d '"')
          echo "builder $b, plugin $p"
          test "$b" = "$p"
      - name: Changelog mentions the version
        run: |
          v=$(grep -oE 'const string Version = "[^"]+"' unity/B52Tools/Editor/B52Builder.cs | grep -oE '[0-9][0-9.]*[0-9]')
          grep -q "^## $v" CHANGELOG.md
